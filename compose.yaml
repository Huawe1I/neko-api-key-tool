services:
  usage:
    # 直接使用已发布的镜像；如需本地构建，取消下方 build 注释并移除 image 中的远程镜像。
    image: pushchair7463/neko-api-key-tool:latest
    # build:
    #   context: .
    #   args:
    #     PUBLIC_URL: /usage
    container_name: neko-api-key-tool
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    # 迁移到新服务器时只需复制 .env.example 为 .env 并修改其中的配置。
    env_file:
      - .env
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
